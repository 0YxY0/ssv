[project]
name = "ssv-agent"
version = "0.1.0"
description = "Site Safety Vision agent orchestration service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "redis>=5.0,<8",
    "python-dotenv>=1.0",
    "deerflow-harness",
    "qdrant-client>=1.9",
]

[project.optional-dependencies]
bge-m3 = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ssv-agent = "ssv_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssv_agent"]

[tool.uv.sources]
deerflow-harness = { path = "third_party/deer-flow/backend/packages/harness", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
